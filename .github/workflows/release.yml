name: release

# Publishes the package to npm on a version tag, using npm trusted publishing (OIDC): no long-lived
# token is stored in the repo, and provenance is attached automatically. Bump the version in
# package.json, then push a tag matching it (v0.1.0 for version 0.1.0). This job verifies the tag
# matches, re-runs the full gate (lint, types, tests, build), publishes, and creates the GitHub
# release.
#
# One-time setup on npmjs.com (Package settings -> Publishing access -> trusted publisher): point it
# at this repository and workflow file (.github/workflows/release.yml). Trusted publishing can only
# be configured on a package that already exists, so the very first publish is a manual bootstrap
# (`npm publish --access public` from a logged-in machine); every release after that runs here with
# no secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, newer than the version bundled with Node 20.
      - run: npm install -g npm@latest

      - name: Verify the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN: the OIDC exchange authenticates, and provenance is generated automatically.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
